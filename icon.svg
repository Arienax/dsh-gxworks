<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="GXWorks Agent">
  <title>GXWorks Agent</title>
  <rect width="128" height="128" rx="28" fill="#0B2A45"/>
  <!-- bus rails -->
  <g stroke="#4CC2FF" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M28 24v80"/>
    <path d="M100 24v80"/>
    <path d="M28 64h18"/>
    <path d="M86 64h14"/>
  </g>
  <!-- series contacts -->
  <g stroke="#E8F4FF" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M50 52v24"/>
    <path d="M62 52v24"/>
    <path d="M46 64h4"/>
    <path d="M62 64h4"/>
  </g>
  <!-- output coil -->
  <rect x="70" y="50" width="16" height="28" rx="7" fill="none" stroke="#FFB020" stroke-width="6"/>
  <!-- scan-cycle accent -->
  <circle cx="40" cy="34" r="4" fill="#4CC2FF" opacity="0.75"/>
  <circle cx="40" cy="94" r="4" fill="#4CC2FF" opacity="0.35"/>
</svg>
